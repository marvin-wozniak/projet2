name: CI/CD workflow
on: push
jobs:

    tests-frontend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./frontend
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: install node
          uses: actions/setup-node@v4
          with: 
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json
        - name: install dependencies
          run: npm ci --prefer-offline --legacy-peer-deps
        - name: run linter
          run: npm run lint
        - name: npm audit
          run: npm audit --audit-level=critical

    tests-backend:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./node-api
      steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: install node
          uses: actions/setup-node@v4
          with: 
            cache: 'npm'
            cache-dependency-path: ./node-api/package-lock.json
        - name: install dependencies
          run: npm ci --prefer-offline --legacy-peer-deps
        - name: run linter
          run: npm run lint
        - name: npm audit
          run: npm audit --audit-level=critical 
        - name: exec unit tests
          run: npm run test:ci




    build-frontend-and-node-api:
        needs: [tests-frontend, tests-backend]
        runs-on: ubuntu-latest
        strategy:
          matrix: 
            include:
            - context_name: ./frontend 
              image_name: ghcr.io/marvin-wozniak/projet/fontend:latest
            - context_name: ./node-api
              image_name: ghcr.io/marvin-wozniak/projet/node-api:latest
        permissions:
          packages: write
        steps:
          - name: checkout
            uses: actions/checkout@v4
          - name: Set up QEMU
            uses: docker/setup-qemu-action@v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Docker meta
            id: meta
            uses: docker/metadata-action@v5
            with: 
              images: ${{ matrix.image_name }}
          - name: Login to Github Container Registry
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: ${{ matrix.context_name }}
              push: true
              tags: ${{ matrix.image_name }}
              cache-from: type=gha
              cache-to: type=gha,mode=max



    e2e:
        needs: [build-frontend-and-node-api]
        runs-on: ubuntu-latest
        steps:
          - name: checkout
            uses: actions/checkout@v4
          
          - name: Login to Github Container Registry
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - name: lancement des tests e2e
            run: |
              docker compose up --exit-code-from cypress --abort-on-container-exit
          - name: clean
            run: | 
              docker compose down -v --remove-orphans
              
