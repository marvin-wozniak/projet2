name: CI/CD workflow
on: push
jobs:
    build-frontend-and-node-api:
        runs-on: ubuntu-latest
        strategy:
          matrix: 
            include:
            - context_name: ./frontend 
              image_name: ghcr.io/marvin-wozniak/projet/fontend:latest
            - context_name: ./node-api
              image_name: ghcr.io/marvin-wozniak/projet/node-api:latest
        permissions:
          packages: write
        steps:
          - name: checkout
            uses: actions/checkout@v4
          - name: Set up QEMU
            uses: docker/setup-qemu-action@v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Docker meta
            id: meta
            uses: docker/metadata-action@v5
            with: 
              images: ${{ matrix.image_name }}
          - name: Login to Github Container Registry
            uses: docker/login-action@v4
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: ${{ matrix.context_name }}
              push: true
              tags: ${{ matrix.image_name }}
              cache-from: type=gha
              cache-to: type=gha,mode=max

